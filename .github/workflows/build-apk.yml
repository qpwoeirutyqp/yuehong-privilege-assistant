name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      variant:
        description: '构建类型'
        required: true
        default: 'Debug'
        type: choice
        options: [ Debug, Release ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.22.1'
          log-accepted-android-sdk-licenses: true

      - name: Show SDK inventory
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/29.0.13113456" >> local.properties
          cat local.properties

      - name: Write server.properties
        run: cp server.properties.example server.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
        run: |
          VARIANT="${{ github.event.inputs.variant || 'Debug' }}"
          chmod +x gradlew
          ./gradlew ":manager:assemble${VARIANT}" --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts
          find . -name '*.apk' -type f -print0 | while IFS= read -r -d '' f; do
            base=$(basename "$f")
            cp "$f" "artifacts/$base"
            echo "APK: $f  ($(du -h "$f" | cut -f1))"
          done
          ls -la artifacts || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuehong-apk
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
