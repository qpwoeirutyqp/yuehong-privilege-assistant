name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      variant:
        description: '构建类型'
        required: true
        default: 'Debug'
        type: choice
        options: [ Debug, Release ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      NDK_VERSION: '29.0.13113456'
      BUILD_TOOLS: '36.0.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      - name: Install SDK components
        run: |
          set -x
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort | tail -1)
          echo "SDKM=$SDKM"
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          yes | "$SDKM" --sdk_root="$SDK_ROOT" \
            "platforms;android-37.0" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1" 2>&1 | tail -30
          echo "--- platforms ---"; ls "$SDK_ROOT/platforms" || true
          echo "--- build-tools ---"; ls "$SDK_ROOT/build-tools" || true
          echo "--- ndk ---"; ls "$SDK_ROOT/ndk" || true
          echo "--- cmake ---"; ls "$SDK_ROOT/cmake" || true
          # AGP 按 android-37 查找；Google 侧包名已改为 37.0，补一个别名
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
            echo "linked android-37 -> android-37.0"
          fi
          ls -la "$SDK_ROOT/platforms"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Write local.properties
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/%s\n' "$SDK_ROOT" "$SDK_ROOT" "$NDK_VERSION" > local.properties
          cat local.properties
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Write server.properties
        run: cp server.properties.example server.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          VARIANT="${{ github.event.inputs.variant || 'Debug' }}"
          chmod +x gradlew
          ./gradlew ":manager:assemble${VARIANT}" --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts
          find . -name '*.apk' -type f -print0 | while IFS= read -r -d '' f; do
            cp "$f" "artifacts/$(basename "$f")"
            echo "APK: $f ($(du -h "$f" | cut -f1))"
          done
          ls -la artifacts || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuehong-apk
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30
